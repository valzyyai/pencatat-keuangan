name: Build Android APK - Pengeluaran Bulanan

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Wrap Web App with Capacitor & Build Debug APK
        run: |
          rm -rf www capacitor.config.json capacitor.config.ts android
          mkdir -p www
          if [ -d pengeluaran-bulanan ]; then cp pengeluaran-bulanan/index.html pengeluaran-bulanan/style.css pengeluaran-bulanan/app.js pengeluaran-bulanan/manifest.json pengeluaran-bulanan/sw.js www/ 2>/dev/null || true; fi
          cp index.html style.css app.js manifest.json sw.js www/ 2>/dev/null || cp index.html style.css app.js www/ 2>/dev/null || true
          ls -la www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Pengeluaran Bulanan" "com.pengeluaranbulanan.app" --web-dir www
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Pengeluaran-Bulanan.apk

      - name: Upload APK to Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pengeluaran-Bulanan-APK
          path: Pengeluaran-Bulanan.apk

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "📱 Download APK — Pengeluaran Bulanan (v1.0.0)"
          body: "Klik file **Pengeluaran-Bulanan.apk** di bawah ini untuk langsung download dan install di HP Android tanpa perlu ekstrak ZIP."
          files: Pengeluaran-Bulanan.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
